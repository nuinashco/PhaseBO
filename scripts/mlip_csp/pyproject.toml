[project]
name = "mlip-csp"
version = "0.0.1"
description = "Random-search CSP with an MLIP over the Li-Sn-S-Cl compositions: the raw data of LiSnSCl_fastchgnet_csp"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ase>=3.23",
    "chgnet>=0.3",
    "fastchgnet",
    "mace-torch>=0.3.10",
    "matplotlib>=3.8",
    "mp-api>=0.45",
    "numpy>=1.26",
    "pandas>=2.2",
    "pymatgen>=2024.8",
    "pyxtal>=1.0",
    "scipy>=1.12",
]

[tool.uv]
package = false  # modules run from scripts/mlip_csp: uv run python -m csp.<step>

[tool.uv.sources]
fastchgnet = { git = "https://github.com/HPC-AI-Team/FastCHGNet" }
