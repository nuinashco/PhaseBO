[project]
name = "phasebo"
version = "0.1.4"
description = "Bayesian optimisation for accelerated exploration of phase fields"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Andrij Vasylenko", email = "and.vasylenko@gmail.com" }
]
urls = { "Homepage" = "http://github.com/DrewNow/PhaseFieldsBO" }

dependencies = [
    "GPyOpt>=1.2.6",
    "matplotlib>=3.11",
    "numpy>=2.4",
    "pandas>=3.0",
    "pymatgen>=2026.9.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.9",
    "scipy>=1.17",
    # GPyOpt (unmaintained since 2020) imports pkg_resources, removed in setuptools 82
    "setuptools<82",
]

[project.scripts]
phasebo = "phasebo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"
