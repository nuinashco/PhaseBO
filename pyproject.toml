[project]
name = "phasebo"
version = "0.1.4"
description = "Bayesian optimisation for accelerated exploration of phase fields"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ivan Havlytskyi", email = "ivan.havlytskyi@gmail.com" },
    { name = "Oleksandr Kharytonov", email = "shah1st.work.ua@gmail.com" },
    { name = "Olena Litovska", email = "litovskaolena@gmail.com" },
    { name = "Andrij Vasylenko", email = "and.vasylenko@gmail.com" },
]
urls = { Homepage = "https://github.com/nuinashco/PhaseBO" }
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1",
    "botorch>=0.18.1",
    "click>=8.5",
    "hydra-core>=1.4.0rc1",  # 1.3.x crashes on Python 3.14 (argparse help check).
    "matplotlib>=3.11",
    "numpy>=2.5",
    "omegaconf>=2.4",
    "pandas>=3.0",
    "pandera>=0.34.1",
    "pydantic>=2.14",
    "pymatgen>=2026.9.24",
    "rootutils>=1.0.7",
    "scipy>=1.17",
    "structlog>=26.1",
    "torch>=2.14",
    "wandb>=0.31",
]

[project.scripts]
phasebo-suggest = "phasebo.cli.suggest:main"
phasebo-benchmark = "phasebo.cli.benchmark:main"
phasebo-generate = "phasebo.cli.generate:main"
phasebo-data = "phasebo.cli.data:main"
phasebo-configs = "phasebo.cli.configs:main"

[dependency-groups]
dev = [
    "conventions-hooks",
    "import-linter>=2.15",
    "pre-commit>=4.7",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
]
notebooks = [
    # 0.25.0 pairs KaTeX 0.18 with KaTeX 0.16 CSS, so sub- and superscripts are not shrunk.
    "marimo>=0.24.2,<0.25",
    "plotly>=7.1",
]

[tool.uv.sources]
# The conventions repo at the template's commit; `copier update` moves the pin.
conventions-hooks = { git = "https://github.com/nuinashco/conventions.git", rev = "16275e2561811e667db5d2fc538420205855eeca" }
# The default Linux torch wheels pull in the CUDA toolkit.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["phasebo", "nuikit"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["CONVENTIONS.md"]  # Vendored guide: fix it upstream, not here.

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH", "C4", "C90", "RUF", "TID",
    "FBT", "N", "PERF", "G", "LOG", "BLE", "PL", "D", "NPY", "ERA", "T20",
    "TD004", "TD005", "TD006", "TD007",  # A TODO says what and why (GUIDE DOC-6).
    "D401",  # The google convention drops imperative mood; selecting it restores it.
]
ignore = [
    "PLC0415",  # Lazy imports of heavy or optional dependencies are deliberate.
    "PLR2004",  # Thresholds and shapes read better inline than as constants.
    "PLR0913",  # Config-heavy constructors take many keyword arguments.
    "D102", "D103", "D105", "D106", "D107",  # Document methods only when non-obvious.
]

[tool.ruff.lint.per-file-ignores]
"src/phasebo/cli/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# pandera turns its check decorators into classmethods.
classmethod-decorators = ["pandera.pandas.dataframe_check", "pandera.pandas.check"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["phasebo"]
section-order = ["future", "standard-library", "third-party", "nuikit", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
nuikit = ["nuikit"]  # Vendored machinery reads apart from the project (GUIDE STY-3).

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "use an in-process fake instead (GUIDE: TST)"

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src/nuikit"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not integration"]
markers = ["integration: end-to-end runs that need external services or data"]

[tool.importlinter]
root_packages = ["phasebo", "nuikit"]

[[tool.importlinter.contracts]]
name = "Layers: cli on top, paths at the bottom, every module placed"
type = "layers"
containers = ["phasebo"]
layers = ["cli", "config", "bo", "field | data", "paths"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "BO: the loops use the families, the batch rules use the surrogate"
type = "layers"
containers = ["phasebo.bo"]
layers = ["replay | proposal | plots", "acquisition | start", "surrogate"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Field: points build on the hull; candidates stand apart"
type = "layers"
containers = ["phasebo.field"]
layers = ["points", "hull | candidates"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Data: the store reads and writes files, the pure table never imports it"
type = "layers"
containers = ["phasebo.data"]
layers = ["store", "table"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "nuikit never imports the project"
type = "forbidden"
source_modules = ["nuikit"]
forbidden_modules = ["phasebo"]
