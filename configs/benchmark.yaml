# Entry config of `phasebo-benchmark`: values set below change every run of this repo.
# Every setting with its default: defaults/benchmark.yaml (generated).
defaults:
  - defaults/benchmark@_here_
  - system: LiSnSCl
  - bo/surrogate: gp
  - bo/acquisition: qlogei
  - benchmark/start: random
  - benchmark/metric: [steps_to_hit, discovery, best_so_far, hazard_ratio]
  - hydra: default
  - _self_
