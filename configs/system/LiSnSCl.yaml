# Li-Sn-S-Cl at a 700 eV cutoff, the phase field of J. Chem. Phys. 160, 054110 (2024).
# Paths are relative to the repository root.
processed: data/processed/LiSnSCl.csv  # from scripts/process_LiSnSCl_700eV.py
elements:
  Li:
    charge: 1
    atoms: [0, 9]
  Sn:
    charge: 4
    atoms: [0, 4]
  S:
    charge: -2
    atoms: [0, 9]
  Cl:
    charge: -1
    atoms: [0, 4]
candidates:
  max_atoms: 16
  file: null  # null: generated
  exclude: null
