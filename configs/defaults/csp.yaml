# Generated by `make configs` from CSPConfig; edit the schema, not this file.
# Chosen through config groups, not listed here: csp/mlip, csp/search.

run_name: "${now:%Y-%m-%d_%H-%M-%S}"  # directory under runs/
seed: 42
deterministic: false  # true: deterministic torch kernels, slower
log_level: "info"  # debug|info|warning|error
log_format: "auto"  # auto|console|json; auto: console in a terminal, JSON otherwise
tracker: null  # wandb: mirror the run to W&B; null: run dir only
wandb_project: "phasebo"
wandb_entity: null  # null: your default entity
formulas: []  # whole cells, as Sc1Al3N4: AlN is one atom of each
formulas_file: null  # CSV with a header row, cells in column 1, added to formulas
csp:
  frameworks: ["cubic", "wurtzite", "hexagonal"]
  phi: 0.6  # a cell's volume is its ions' Shannon volume over phi
  c_over_a: null  # of wurtzite and hexagonal; null: 1.633 and 1.40
  symprec: 0.3  # A; of the released cell's space group
  device: "auto"  # auto|cpu|cuda; auto: cuda if torch sees a GPU
  workers: 1  # processes, each loading the MLIP; above 1 on cpu only
  references:
    directory: null  # of CIFs, every element alone among them; null: no table
    fmax: 0.05  # eV/A; cell free
    steps: 500

publish: null  # a phase field's name: also write data/processed/<name>.csv and <name>/; needs csp.references.directory
