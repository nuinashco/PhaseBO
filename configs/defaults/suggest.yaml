# Generated by `make configs` from SuggestConfig; edit the schema, not this file.
# Chosen through config groups, not listed here: system.

run_name: "${now:%Y-%m-%d_%H-%M-%S}"  # directory under runs/
seed: 42
deterministic: false  # torch kernels; slower
log_level: "info"  # debug|info|warning|error
log_format: "auto"  # auto|console|json; auto: console in a terminal
tracker: null  # wandb: mirror the run to W&B; null: run dir only
wandb_project: "phasebo"
bo:
  acquisition: "qlogei"  # qlogei: batch log expected improvement; ts: Thompson sampling
  kernel: "matern"  # matern: Matern 5/2, as in the paper; rbf
  noise_mev: 0.0  # std in meV/atom; null: fitted
  batch_size: 4

show_plots: false
plot_dpi: 150
