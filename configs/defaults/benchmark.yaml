# Generated by `make configs` from BenchmarkConfig; edit the schema, not this file.
# Chosen through config groups, not listed here: system, bo/surrogate, bo/acquisition, bo/start.

run_name: "${now:%Y-%m-%d_%H-%M-%S}"  # directory under runs/
seed: 42
deterministic: false  # true: deterministic torch kernels, slower
log_level: "info"  # debug|info|warning|error
log_format: "auto"  # auto|console|json; auto: console in a terminal, JSON otherwise
tracker: null  # wandb: mirror the run to W&B; null: run dir only
wandb_project: "phasebo"
fidelity: "dft"  # a value of the processed table's fidelity column
show_plots: false
plot_dpi: 150
bo:
  batch_size: 4
  max_iter: 10  # BO batches after the starts
